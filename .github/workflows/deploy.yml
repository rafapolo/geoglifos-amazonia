name: Publica no GitHub Pages

on:
  push:
    branches: [main]
    # arquivos que não vão para dist/ não disparam um deploy
    paths-ignore:
      - '**.md'
      - 'design/**'
      - 'script/*.py'
      - 'script/*.sh'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancela um deploy em andamento quando chega um push mais novo
concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  # um job só: um segundo esperaria pelo próprio runner só para publicar
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # versão fixa: uma atualização silenciosa do Bun já quebrou outro projeto
          bun-version: 1.4.4

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'
          retention-days: 3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
